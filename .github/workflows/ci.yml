name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo rm -f /etc/apt/sources.list.d/google-chrome.list
            sudo apt-get -o Acquire::Retries=3 update
            sudo apt-get -o Acquire::Retries=3 install -y ffmpeg
          fi
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: |
          brew list ffmpeg-full >/dev/null 2>&1 || brew install ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - name: Verify FFmpeg capabilities
        run: node scripts/verify-ffmpeg.mjs
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run check
      - run: npm run benchmark
      - run: npm run examples:verify
        if: matrix.node == 22
      - run: npm run package:verify
        if: matrix.node == 22
  studio-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo rm -f /etc/apt/sources.list.d/google-chrome.list
            sudo apt-get -o Acquire::Retries=3 update
            sudo apt-get -o Acquire::Retries=3 install -y ffmpeg
          fi
      - name: Verify FFmpeg capabilities
        run: node scripts/verify-ffmpeg.mjs
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:studio-e2e
      - name: Verify sustained Studio playback
        run: node scripts/benchmark-studio-playback.mjs
  coverage:
    # Pin a runner with FFmpeg 6.1+: Ubuntu 22.04 supplies 4.4, which lacks
    # the limiter latency compensation required by the native audio graph.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo rm -f /etc/apt/sources.list.d/google-chrome.list
            sudo apt-get -o Acquire::Retries=3 update
            sudo apt-get -o Acquire::Retries=3 install -y ffmpeg
          fi
      - name: Verify FFmpeg capabilities
        run: node scripts/verify-ffmpeg.mjs
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:coverage
