name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install FFmpeg
        run: command -v ffmpeg >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y ffmpeg; }
      - run: npm ci
      - run: npm run check
      - run: npm run examples:verify
      - run: npm run package:verify
      - run: npx playwright install --with-deps chromium
      - run: npm run test:studio-e2e
      - name: Verify tag matches package version
        run: node -e 'const expected = `v${require("./package.json").version}`; if (process.env.GITHUB_REF_NAME !== expected) { console.error(`Tag ${process.env.GITHUB_REF_NAME} does not match ${expected}.`); process.exit(1); }'
      - name: Build distributable package
        run: |
          mkdir -p release
          npm pack --ignore-scripts --pack-destination release
          cd release
          sha256sum *.tgz > SHA256SUMS
      - name: Create release and attach verified package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes --title "Genmotion ${GITHUB_REF_NAME#v}"
          gh release upload "${GITHUB_REF_NAME}" release/*.tgz release/SHA256SUMS --clobber
